server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: indice

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}

  jpa:
    database: POSTGRESQL
    show-sql: true
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}

  data:
    web:
      pageable:
        max-page-size: 100

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

twelvedata:
  base-url: https://api.twelvedata.com
  api-token: ${TWELVEDATA_API_TOKEN}

etf:
  catalog:
    # ETF proposés dans l'application (tickers américains, offre gratuite de Twelve Data).
    # Un ticker absent de la réponse de Twelve Data n'apparaît pas dans le catalogue.
    country: United States
    selected-tickers:
      - SPY  # SPDR S&P 500
      - QQQ  # Invesco Nasdaq-100
      - VTI  # Vanguard Total Stock Market (marché américain)
      - URTH # iShares MSCI World
      - VEA  # Vanguard FTSE Developed Markets (pays développés hors États-Unis)
      - VGK  # Vanguard FTSE Europe
      - EEM  # iShares MSCI Emerging Markets
      - BND  # Vanguard Total Bond Market (obligations)
      - GLD  # SPDR Gold Shares (or)
      - SCHD # Schwab U.S. Dividend Equity

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: indice

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}

  jpa:
    database: POSTGRESQL
    show-sql: true
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        jdbc.batch_size: 100
        order_inserts: true

  data:
    web:
      pageable:
        max-page-size: 100

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

twelvedata:
  base-url: https://api.twelvedata.com
  api-token: ${TWELVEDATA_API_TOKEN}

etf:
  catalog:
    # Pays des ETF proposés : le catalogue contient tous les ETF de ce pays renvoyés par Twelve Data
    # (l'offre gratuite ne couvre que les États-Unis).
    country: United States
